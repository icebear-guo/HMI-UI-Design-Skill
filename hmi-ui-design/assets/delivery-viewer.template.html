<header><h1>HMI UI 设计交付</h1><button id="runtime-tab">交互演示</button><button id="page-tab">设计标注</button><button id="asset-tab">独立切片</button><button id="font-tab">字体资源</button><a href="manifest.json" download>交付清单</a></header>
<div id="workspace"><nav id="navigation" aria-label="页面导航"></nav><main id="main"></main><aside id="inspector" aria-label="设计标注"></aside></div>
<script id="design-data" type="application/json">__DESIGN_DATA__</script>
<script>
'use strict';
const model=JSON.parse(document.getElementById('design-data').textContent);
const nav=document.getElementById('navigation'),main=document.getElementById('main'),inspector=document.getElementById('inspector');
let pageIndex=0,zoom=1,boxes=true,selected=null;
function element(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=String(text);if(cls)n.className=cls;return n;}
function kv(label,value){const dl=element('dl',undefined,'kv');dl.append(element('dt',label),element('dd',value===undefined?'未提供':value));inspector.append(dl);}
function buttonAssets(layer){if(model.element_inventory){const page=model.pages[pageIndex],plate=model.element_inventory.elements.find(e=>e.page_id===page.id&&e.layer_id===layer.id&&e.asset_role==='control_plate'&&e.delivery_mode==='export');return plate?plate.asset_refs.map(r=>model.assets.find(a=>a.id===r.asset_id)).filter(Boolean):[];}return model.assets.filter(a=>a.component_id===layer.id&&(a.asset_role||'control_plate')==='control_plate');}
function buttonPreview(layer){if(!['button','control'].includes(layer.type.toLowerCase()))return;const states=buttonAssets(layer),s0=states.find(a=>a.state.toLowerCase()==='s0'),s1=states.find(a=>a.state.toLowerCase()==='s1');if(!s0||!s1)return;const box=element('section'),title=element('h2','按钮资产 / 底板预览'),note=element('p','按住显示s1，释放回s0。此处仅展示独立资产，不重绘完整页面，也不发送设备命令。','muted'),button=element('button'),face=element('img'),state=element('p','s0 常态','muted');button.type='button';button.setAttribute('aria-label','按住预览按钮交互反馈');button.style.cssText='padding:0;border:1px solid #aebbc6;max-width:100%;background:#edf1f5';face.style.cssText='display:block;max-width:100%;height:auto';function show(asset,label){face.src=asset.file;face.alt=layer.name+' '+asset.state;state.textContent=label;}show(s0,'s0 常态');button.append(face);button.onpointerdown=e=>{show(s1,'s1 交互反馈');button.setPointerCapture(e.pointerId);};button.onpointerup=button.onpointercancel=button.onlostpointercapture=()=>show(s0,'s0 常态');button.onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();show(s1,'s1 交互反馈');}};button.onkeyup=button.onblur=()=>show(s0,'s0 常态');box.append(title,note,button,state);inspector.append(box);}
function details(page,layer){inspector.replaceChildren(element('h2',layer?'组件标注':'页面标注'));kv('页面',page.name);kv('设计画布 px',page.design_size_px.join(' × '));kv('预览实际像素',page.actual_preview_px.join(' × '));kv('预览倍率 x / y',page.preview_scale_xy.join(' / '));if(layer){kv('组件 ID / 类型',layer.id+' / '+layer.type);kv('名称',layer.name);kv('逻辑矩形 x, y, w, h',layer.rect_px.join(', '));kv('填充色',layer.fill);if(layer.font){kv('字体',layer.font.family);kv('字号 px',layer.font.size_px);kv('字重',layer.font.weight);}kv('文本',layer.text);buttonPreview(layer);}else{kv('提示','点击画面标注区域，或从图层菜单选择组件。显示坐标使用设计画布单位。');}}
function renderStage(page,host,menu){host.replaceChildren();const stage=element('div',undefined,'stage'+(boxes?' show-boxes':''));stage.style.width=(page.design_size_px[0]*zoom)+'px';stage.style.height=(page.design_size_px[1]*zoom)+'px';const image=element('img');image.src=page.preview;image.alt=page.name;stage.append(image);const sorted=[...page.layers].sort((a,b)=>(b.rect_px[2]*b.rect_px[3])-(a.rect_px[2]*a.rect_px[3]));for(const layer of sorted){const button=element('button',undefined,'layer'+(selected===layer.id?' selected':''));button.type='button';button.title=layer.name;button.setAttribute('aria-label',layer.name);const [x,y,w,h]=layer.rect_px;button.style.left=(x*zoom)+'px';button.style.top=(y*zoom)+'px';button.style.width=(w*zoom)+'px';button.style.height=(h*zoom)+'px';button.onclick=()=>{selected=layer.id;menu.value=layer.id;details(page,layer);renderStage(page,host,menu);};stage.append(button);}host.append(stage);}
function pages(){nav.replaceChildren();model.pages.forEach((p,i)=>{const b=element('button',p.name,i===pageIndex?'active':'');b.onclick=()=>{pageIndex=i;selected=null;pages();};nav.append(b);});main.replaceChildren();const page=model.pages[pageIndex],tools=element('div',undefined,'tools'),label=element('label','缩放 '),range=element('input'),value=element('span',Math.round(zoom*100)+'%'),toggle=element('button',boxes?'隐藏标注框':'显示标注框'),menu=element('select'),host=element('div');range.type='range';range.min='25';range.max='200';range.step='25';range.value=zoom*100;range.setAttribute('aria-label','画面缩放');label.append(range,value);menu.setAttribute('aria-label','选择图层');menu.append(new Option('选择图层',''));for(const l of page.layers)menu.append(new Option(l.name+' ['+l.id+']',l.id));menu.value=selected||'';range.oninput=()=>{zoom=Number(range.value)/100;value.textContent=Math.round(zoom*100)+'%';renderStage(page,host,menu);};toggle.onclick=()=>{boxes=!boxes;toggle.textContent=boxes?'隐藏标注框':'显示标注框';renderStage(page,host,menu);};menu.onchange=()=>{selected=menu.value||null;details(page,page.layers.find(l=>l.id===selected));renderStage(page,host,menu);};tools.append(label,toggle,menu);main.append(tools,element('p','预览像素与逻辑标注分开记录；缩放不改变设计尺寸。','muted'),host);details(page,page.layers.find(l=>l.id===selected));renderStage(page,host,menu);}
function assets(){nav.replaceChildren(element('p',model.assets.length+' 个独立资产'));main.replaceChildren();inspector.replaceChildren(element('h2','资产说明'));kv('范围','文件尺寸、状态编号与组件归属见每张卡片；图像不代表工程状态绑定已完成。');const grid=element('div',undefined,'cards');for(const a of model.assets){const card=element('article',undefined,'card'),thumb=element('div',undefined,'thumb'),img=element('img'),link=element('a','下载 PNG');img.src=a.file;img.alt=a.id;thumb.append(img);link.href=a.file;link.download='';card.append(thumb,element('h2',a.id),element('p',a.component_id+' / '+(a.asset_role||'legacy')+' / '+a.state),element('p',a.actual_size_px.join(' × ')+' px'),element('p','设计 '+a.design_size_px.join(' × ')+'；倍率 '+a.export_scale_xy.join(' / '),'muted'),link);grid.append(card);}main.append(grid);}
function fonts(){nav.replaceChildren(element('p','字体资源清单'));main.replaceChildren(element('h2','字体资源'));inspector.replaceChildren(element('h2','使用说明'));kv('说明','仅包含已明确允许随本次交付提供的字体，不自动安装。实际字体替换和设备支持仍需核实。');if(!model.fonts.length){main.append(element('p','未提供可随交付分发的字体文件。请按目标设备确认可用字体与回退方案。','notice'));return;}for(const f of model.fonts){const p=element('p'),a=element('a',(f.family||'字体资源')+' · 下载');a.href=f.file;a.download='';p.append(a);main.append(p);}}
// Local prototype values are deliberately independent of any equipment connection.
const definitions=model.simulation?.variables||[];
let values=Object.fromEntries(definitions.map(v=>[v.id,v.initial])),forces={},runtimeUpdates=[],driverUpdates=[],timer=null,keypad=null,keypadReturn=null,playControl=null;
const momentaryReleases=new Set();
function stopCycle(){if(timer!==null){clearInterval(timer);timer=null;}if(playControl)playControl.textContent='开始演示';}
function releaseMomentaries(){for(const release of [...momentaryReleases])release();}
function closeKeypad(){if(keypad){keypad.remove();keypad=null;const target=keypadReturn;keypadReturn=null;if(target?.isConnected)target.focus();}}
function leaveRuntime(){stopCycle();releaseMomentaries();closeKeypad();runtimeUpdates=[];driverUpdates=[];}
function effective(id){return Object.hasOwn(forces,id)?forces[id]:values[id];}
function valueLabel(id){const d=definitions.find(v=>v.id===id);return d.type==='boolean'?(effective(id)?'ON / 1':'OFF / 0'):String(effective(id))+(d.unit?' '+d.unit:'');}
function refreshRuntime(){for(const update of [...runtimeUpdates,...driverUpdates])update();}
function setValue(id,value){values[id]=value;refreshRuntime();}
function cycleStep(){for(const d of definitions.filter(v=>v.type==='number'&&v.animate)){const next=values[d.id]+d.step;values[d.id]=Number((next>d.max+1e-8?d.min:next).toFixed(9));}refreshRuntime();}
function openKeypad(layer,trigger){
  stopCycle();closeKeypad();const d=definitions.find(v=>v.id===layer.interaction.variable),shade=element('div',undefined,'keypad-shade'),panel=element('section',undefined,'keypad'),input=element('input'),grid=element('div',undefined,'keypad-grid'),error=element('p','', 'keypad-error');
  let fresh=true;shade.setAttribute('data-role','keypad');panel.setAttribute('role','dialog');panel.setAttribute('aria-modal','true');panel.setAttribute('aria-label',layer.text+' 参数键盘');input.type='text';input.inputMode='decimal';input.value=String(values[d.id]);input.oninput=()=>{fresh=false;};input.setAttribute('aria-label','参数输入');error.setAttribute('role','alert');
  function confirm(){const raw=input.value.trim(),n=Number(raw),q=(n-d.min)/d.step;if(!raw||!/^[-+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(raw)||!Number.isFinite(n)||n<d.min||n>d.max||Math.abs(q-Math.round(q))>1e-7){error.textContent='请输入 '+d.min+'～'+d.max+'，步长 '+d.step+' 的数值';return;}setValue(d.id,Number(n.toFixed(9)));closeKeypad();}
  for(const key of ['7','8','9','4','5','6','1','2','3','-','0','.','清空','退格','确认']){const b=element('button',key);b.type='button';b.onclick=()=>{if(key==='确认'){confirm();return;}if(fresh&&/^[0-9.]$/.test(key))input.value='';fresh=false;input.value=key==='清空'?'':key==='退格'?input.value.slice(0,-1):key==='-'?(input.value.startsWith('-')?input.value.slice(1):'-'+input.value):input.value+key;input.focus();};grid.append(b);}
  const cancel=element('button','取消');cancel.type='button';cancel.onclick=closeKeypad;panel.append(element('h2',layer.text),element('p','范围 '+d.min+'～'+d.max+'；步长 '+d.step+(d.unit?'；单位 '+d.unit:''),'muted'),input,grid,error,cancel);shade.append(panel);document.body.append(shade);keypad=shade;keypadReturn=trigger;
  shade.onkeydown=e=>{if(e.key==='Escape'){e.preventDefault();closeKeypad();}else if(e.key==='Enter'){e.preventDefault();confirm();}else if(e.key==='Tab'){const focusable=[input,...grid.children,cancel],index=focusable.indexOf(document.activeElement),next=e.shiftKey?(index-1+focusable.length)%focusable.length:(index+1)%focusable.length;e.preventDefault();focusable[next].focus();}};input.focus();input.select();
}
function runtimeControl(layer,wrapper){
  const it=layer.interaction,button=element('button',undefined,'runtime-button'),face=element('img'),label=element('span',undefined,'runtime-label'),caption=element('span',layer.text),status=element('span',undefined,'runtime-value'),lamp=element('span',undefined,'runtime-lamp');
  const states=buttonAssets(layer),s0=states.find(a=>a.state.toLowerCase()==='s0'),s1=states.find(a=>a.state.toLowerCase()==='s1');button.type='button';button.setAttribute('aria-label',layer.text);button.setAttribute('data-component',layer.id);face.alt='';label.append(caption);if(it.variable){if(it.kind!=='parameter')label.append(lamp);label.append(status);}button.append(face,label);wrapper.append(button);
  let held=false,pressSource=null;
  function show(down){face.src=(down?s1:s0).file;button.setAttribute('data-state',down?'s1':'s0');}
  function release(){if(!held)return;held=false;pressSource=null;show(false);momentaryReleases.delete(release);if(it.kind==='momentary')setValue(it.variable,false);}
  function press(source){if(held)return;held=true;pressSource=source;show(true);momentaryReleases.add(release);if(it.kind==='momentary')setValue(it.variable,true);}
  function activate(){if(it.kind==='navigation'){leaveRuntime();pageIndex=model.pages.findIndex(p=>p.id===it.target_page);runtime();}else if(it.kind==='parameter')openKeypad(layer,button);else if(it.kind==='output'){if(!Object.hasOwn(forces,it.variable))forces[it.variable]=true;else if(forces[it.variable])forces[it.variable]=false;else delete forces[it.variable];refreshRuntime();}else if(['toggle','indicator','io-input'].includes(it.kind))setValue(it.variable,!values[it.variable]);}
  button.onpointerdown=e=>{if(e.button!==undefined&&e.button!==0)return;press('pointer');button.setPointerCapture(e.pointerId);};button.onpointerup=button.onpointercancel=button.onlostpointercapture=release;button.onblur=release;button.onclick=()=>{if(it.kind!=='momentary')activate();};button.onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();if(!e.repeat)press('keyboard');}};button.onkeyup=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();const activateAfter=held&&pressSource==='keyboard';release();if(activateAfter&&it.kind!=='momentary')activate();}};show(false);
  let mode=null;if(it.kind==='output'){wrapper.className+=' runtime-output';mode=element('select');mode.setAttribute('aria-label',layer.text+' 强制模式');for(const [value,title] of [['auto','自动 / 解除强制'],['on','强制 ON（模拟）'],['off','强制 OFF（模拟）']])mode.append(new Option(title,value));mode.onchange=()=>{if(mode.value==='auto')delete forces[it.variable];else forces[it.variable]=mode.value==='on';refreshRuntime();};wrapper.append(mode);}
  runtimeUpdates.push(()=>{if(!it.variable)return;const on=effective(it.variable);lamp.className='runtime-lamp'+(on?' on':'');status.textContent=valueLabel(it.variable)+(it.kind==='output'?'\n'+(Object.hasOwn(forces,it.variable)?'模拟强制；自动值 '+(values[it.variable]?'1':'0'):'自动跟随'): '');if(['toggle','indicator','io-input','output'].includes(it.kind))button.setAttribute('aria-pressed',String(Boolean(on)));if(mode){mode.value=Object.hasOwn(forces,it.variable)?(forces[it.variable]?'on':'off'):'auto';wrapper.className='runtime-component runtime-control runtime-output'+(mode.value!=='auto'?' forced':'');}});
}
function runtime(){
  leaveRuntime();if(!model.simulation){nav.replaceChildren();main.replaceChildren(element('p','此旧版交付仅包含设计标注，缺少可操作原型。','notice'));inspector.replaceChildren();return;}
  const page=model.pages[pageIndex];nav.replaceChildren();model.pages.forEach((p,i)=>{const b=element('button',p.name,i===pageIndex?'active':'');b.onclick=()=>{pageIndex=i;runtime();};nav.append(b);});main.replaceChildren();inspector.replaceChildren(element('h2','本地模拟变量'));
  const banner=element('p','本地交互模拟 · 不连接设备；按钮反馈不代表设备已执行。','runtime-banner'),tools=element('div',undefined,'tools'),reset=element('button','重置模拟'),play=element('button','开始演示'),stage=element('div',undefined,'runtime-stage'),canvas=element('div',undefined,'runtime-canvas'),background=element('img');
  stage.setAttribute('data-page',page.id);stage.style.width=page.design_size_px[0]+'px';stage.style.height=page.design_size_px[1]+'px';canvas.style.width=page.design_size_px[0]+'px';canvas.style.height=page.design_size_px[1]+'px';background.className='runtime-background';background.src=page.preview;background.alt=page.name;canvas.append(background);stage.append(canvas);
  reset.onclick=()=>{leaveRuntime();values=Object.fromEntries(definitions.map(v=>[v.id,v.initial]));forces={};runtime();};reset.setAttribute('data-role','reset');play.setAttribute('data-role','play');playControl=play;play.disabled=!definitions.some(v=>v.animate);play.onclick=()=>{if(timer!==null){stopCycle();}else{timer=setInterval(cycleStep,500);play.textContent='暂停演示';}};tools.append(play,reset);main.append(banner,tools,stage);
  for(const layer of page.layers.filter(l=>l.interaction)){const it=layer.interaction,wrapper=element('div',undefined,'runtime-component'+(['gauge','bar'].includes(it.kind)?'':' runtime-control')),[x,y,w,h]=layer.rect_px;wrapper.style.left=x+'px';wrapper.style.top=y+'px';wrapper.style.width=w+'px';wrapper.style.height=h+'px';wrapper.setAttribute('data-layer',layer.id);if(layer.font){wrapper.style.fontFamily=layer.font.family;wrapper.style.fontSize=layer.font.size_px+'px';}canvas.append(wrapper);
    if(!['gauge','bar'].includes(it.kind)){runtimeControl(layer,wrapper);continue;}
    const title=element('strong',layer.text),readout=element('span',undefined,'runtime-value'),d=definitions.find(v=>v.id===it.variable),track=element('div',undefined,it.kind==='gauge'?'runtime-dial':'runtime-track'),fill=element('div',undefined,it.kind==='gauge'?'runtime-needle':'runtime-fill');track.append(fill);wrapper.append(title,track,readout,element('small',d.min+' ～ '+d.max+(d.unit?' '+d.unit:''),'muted'));wrapper.setAttribute('role','meter');wrapper.setAttribute('aria-label',layer.text);wrapper.setAttribute('aria-valuemin',d.min);wrapper.setAttribute('aria-valuemax',d.max);runtimeUpdates.push(()=>{const ratio=(effective(d.id)-d.min)/(d.max-d.min);wrapper.setAttribute('aria-valuenow',effective(d.id));readout.textContent=valueLabel(d.id);if(it.kind==='gauge')fill.style.transform='rotate('+(-90+ratio*180)+'deg)';else{fill.style.width=(it.orientation==='vertical'?100:ratio*100)+'%';fill.style.height=(it.orientation==='vertical'?ratio*100:100)+'%';}});
  }
  const commands=new Set(model.pages.flatMap(p=>p.layers.filter(l=>l.interaction?.kind==='momentary').map(l=>l.interaction.variable)));
  for(const d of definitions){const row=element('label',undefined,'runtime-driver'),value=element('span'),input=element('input');input.setAttribute('aria-label','模拟变量 '+d.id);input.setAttribute('data-variable',d.id);row.append(element('strong',d.id),value,input);inspector.append(row);if(d.type==='boolean'){input.type='checkbox';input.disabled=commands.has(d.id);input.onchange=()=>setValue(d.id,input.checked);}else{input.type='range';input.min=d.min;input.max=d.max;input.step=d.step;input.oninput=()=>setValue(d.id,Number(input.value));}driverUpdates.push(()=>{value.textContent=' '+valueLabel(d.id);if(d.type==='boolean')input.checked=values[d.id];else input.value=values[d.id];});}
  refreshRuntime();
}
document.addEventListener('visibilitychange',()=>{if(document.hidden){releaseMomentaries();stopCycle();}});window.addEventListener('blur',releaseMomentaries);
document.getElementById('runtime-tab').onclick=runtime;document.getElementById('page-tab').onclick=()=>{leaveRuntime();pages();};document.getElementById('asset-tab').onclick=()=>{leaveRuntime();assets();};document.getElementById('font-tab').onclick=()=>{leaveRuntime();fonts();};if(model.simulation)runtime();else pages();
</script>
</html>
